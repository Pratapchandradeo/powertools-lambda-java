version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    commit-message:
      prefix: chore

  - package-ecosystem: docker
    directories:
      - "/powertools-e2e-tests/src/test/resources/docker"
      - "/docs"
      - "/examples/**"
    schedule:
      interval: daily
    commit-message:
      prefix: chore

  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "maven"
      - "dependencies"

  # Keep the Codespaces / Dev Container base image and features up to date.
  # Monthly is enough — this is not application code.
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: chore
